services:
  propresenter-toolkit:
    build: .
    image: propresenter-toolkit:latest
    container_name: propresenter-toolkit
    ports:
      - "5000:5000"
    volumes:
      - styles-data:/data/styles
    environment:
      # Uncomment to require a login (recommended if reachable beyond your LAN):
      # PPT_AUTH: "team:change-me"
      PPT_ADDR: ":5000"
    restart: unless-stopped

volumes:
  styles-data:
