name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check the install script parses
        run: sh -n deploy/install.sh

  # Runs the real installer on a fresh machine (systemd + apt, like a Debian
  # LXC), checks the service answers, then re-runs it as an update would.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install
        run: sudo sh deploy/install.sh
      - name: Service responds on port 80
        run: |
          curl -fsS http://127.0.0.1/ | grep -q "Convert a PDF"
          curl -fsS http://127.0.0.1/styles | grep -q "Message (Prompts)"
      - name: Re-run (update) migrates the old port and keeps settings
        run: |
          sudo sed -i 's/^PPT_ADDR=.*/PPT_ADDR=:5000/' /etc/propresenter-toolkit.env
          echo 'PPT_AUTH=team:secret' | sudo tee -a /etc/propresenter-toolkit.env
          sudo sh deploy/install.sh
          sudo grep -qx 'PPT_ADDR=:80' /etc/propresenter-toolkit.env
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/)" = 401
          curl -fsS -u team:secret http://127.0.0.1/ | grep -q "Convert a PDF"
      - name: Logs
        if: always()
        run: sudo journalctl -u propresenter-toolkit --no-pager | tail -50
